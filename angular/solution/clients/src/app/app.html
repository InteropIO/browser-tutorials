<body>
    <header>
        <h1 class="io-title-large">Clients</h1>
        <div [ngClass]="ioConnectStatus() === 'available' ? 'io-pill io-pill-success' : 'io-pill io-pill-critical'">{{ ioConnectStatus() }}</div>
    </header>
    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Full Name</th>
                    <th>PID</th>
                    <th>GID</th>
                    <th>Account Manager</th>
                </tr>
            </thead>
            <tbody>
                @for (client of clients; track client.id) {
                <tr (click)="handleClientClick(client)">
                    <td>{{client.name}}</td>
                    <td>{{client.pId}}</td>
                    <td>{{client.gId}}</td>
                    <td>{{client.accountManager}}</td>
                </tr>
                }
            </tbody>
        </table>
    </div>
</body>
